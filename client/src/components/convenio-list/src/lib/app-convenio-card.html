<div class="justify-between" hlmCard>
  <div hlmCardHeader>
    <h3 hlmCardTitle>{{ convenio().nombre }}</h3>

    @if (!convenio().activo) {
      <div hlmCardAction>
        <span hlmBadge variant="destructive">Inactivo</span>
      </div>
    }
  </div>
  <div hlmCardContent>
    <p class="text-sm text-muted-foreground">
      {{ convenio().empleados_activos }}
      {{
        convenio().empleados_activos === 1
          ? "empleado activo"
          : "empleados activos"
      }}
    </p>
  </div>
  <div class="justify-end" hlmCardFooter>
    <a
      hlmBtn
      size="sm"
      variant="outline"
      [routerLink]="['/convenios', convenio().id]"
    >
      Ver detalle
    </a>
  </div>
</div>
