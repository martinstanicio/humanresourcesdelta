<div class="justify-between" hlmCard>
  <div hlmCardHeader>
    <div class="flex items-start justify-between gap-2">
      <div class="min-w-0">
        <h3 class="truncate text-base font-semibold tracking-tight" [title]="empleado().nombre">
          {{ empleado().nombre }}
        </h3>
        <p class="text-xs text-muted-foreground">Legajo: #{{ empleado().legajo }}</p>
      </div>
      <div class="flex shrink-0 flex-col items-end gap-1">
        <span hlmBadge [variant]="empleado().activo ? 'default' : 'secondary'">
          {{ empleado().activo ? "Activo" : "Inactivo" }}
        </span>
        <span class="text-xs" hlmBadge variant="outline">
          {{ empleado().rol === "rrhh" ? "RRHH" : "Empleado" }}
        </span>
      </div>
    </div>
  </div>
  <div class="space-y-1.5 text-sm text-muted-foreground" hlmCardContent>
    <div class="flex items-center justify-between">
      <span class="text-xs font-medium text-foreground">Fecha de ingreso:</span>
      <span class="text-xs">{{ formattedFechaIngreso() }}</span>
    </div>
    <div class="flex items-center justify-between">
      <span class="text-xs font-medium text-foreground">Convenio:</span>
      <span class="max-w-40 truncate text-xs" [title]="convenioNombre() || 'Sin convenio'">
        {{ convenioNombre() || "Sin convenio" }}
      </span>
    </div>
  </div>
  <div class="justify-end" hlmCardFooter>
    <a
      hlmBtn
      size="sm"
      variant="outline"
      [routerLink]="['/empleados', empleado().legajo]"
    >
      Ver detalle
    </a>
  </div>
</div>
