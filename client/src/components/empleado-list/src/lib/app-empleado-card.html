<div class="justify-between" hlmCard>
  <div hlmCardHeader>
    <h3 hlmCardTitle>
      {{ empleado().nombre }}
      <span class="text-muted-foreground">#{{ empleado().legajo }}</span>
    </h3>

    @if (!empleado().activo || empleado().rol === "rrhh") {
      <div class="flex gap-1.5" hlmCardAction>
        @if (empleado().rol === "rrhh") {
          <span hlmBadge variant="default">RRHH</span>
        }
        @if (!empleado().activo) {
          <span hlmBadge variant="destructive">Inactivo</span>
        }
      </div>
    }
  </div>

  <div class="grid gap-1 text-sm text-muted-foreground" hlmCardContent>
    <p>Ingreso: {{ formattedFechaIngreso() }}</p>
    <p>Convenio: {{ convenioNombre() || "Sin convenio" }}</p>
  </div>

  <div class="justify-end" hlmCardFooter>
    <a
      hlmBtn
      size="sm"
      variant="outline"
      [routerLink]="['/empleados', empleado().legajo]"
    >
      Ver detalle
    </a>
  </div>
</div>
