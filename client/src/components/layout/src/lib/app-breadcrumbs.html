<nav hlmBreadcrumb>
  <ol hlmBreadcrumbList>
    <li
      class="sm:block"
      hlmBreadcrumbItem
      [class.hidden]="currentItem() !== null"
    >
      <a hlmBreadcrumbLink link="/">HRΔ</a>
    </li>
    @if (currentItem(); as item) {
      <li class="hidden sm:block" hlmBreadcrumbSeparator></li>
      @if (extraLabel(); as extra) {
        <li hlmBreadcrumbItem>
          <a hlmBreadcrumbLink [link]="item.href">{{ item.title }}</a>
        </li>
        <li hlmBreadcrumbSeparator></li>
        <li hlmBreadcrumbItem>
          <span hlmBreadcrumbPage>{{ extra }}</span>
        </li>
      } @else {
        <li hlmBreadcrumbItem>
          <span hlmBreadcrumbPage>{{ item.title }}</span>
        </li>
      }
    }
  </ol>
</nav>
