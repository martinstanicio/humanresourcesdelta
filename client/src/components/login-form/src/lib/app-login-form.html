<hlm-card>
  <div hlmCardHeader>
    <h3 hlmCardTitle>Iniciar sesión</h3>
    <p hlmCardDescription>
      Ingresá tu legajo y contraseña para acceder a tu cuenta
    </p>
  </div>
  <div hlmCardContent>
    <form (ngSubmit)="onSubmit()">
      <hlm-field-group>
        <hlm-field [forceInvalid]="getFieldError('legajo').length > 0">
          <label for="legajo" hlmFieldLabel>Legajo</label>
          <input
            hlmInput
            id="legajo"
            name="legajo"
            placeholder="1042"
            required
            type="text"
            [(ngModel)]="legajo"
          />
          @for (err of getFieldError("legajo"); track err) {
            <hlm-field-error forceShow>{{ err }}</hlm-field-error>
          }
        </hlm-field>
        <hlm-field [forceInvalid]="getFieldError('password').length > 0">
          <label for="password" hlmFieldLabel>Contraseña</label>
          <input
            hlmInput
            id="password"
            name="password"
            required
            type="password"
            [(ngModel)]="password"
          />
          @for (err of getFieldError("password"); track err) {
            <hlm-field-error forceShow>{{ err }}</hlm-field-error>
          }
        </hlm-field>
        <hlm-field>
          <button hlmBtn type="submit" [disabled]="loading()">
            {{ loading() ? "Iniciando sesión..." : "Iniciar sesión" }}
          </button>
        </hlm-field>
      </hlm-field-group>
    </form>
    <div class="mt-4 text-center text-sm text-muted-foreground">
      ¿Primer ingreso?
      <a hlmBtn routerLink="/onboarding" variant="link">Crear contraseña</a>
    </div>
  </div>
</hlm-card>
