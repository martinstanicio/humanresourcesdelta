<hlm-card>
  <div hlmCardHeader>
    <h3 hlmCardTitle>Iniciar sesión</h3>
    <p hlmCardDescription>
      Ingresá tu legajo y contraseña para acceder a tu cuenta
    </p>
  </div>
  <div hlmCardContent>
    <form>
      <hlm-field-group>
        <hlm-field>
          <label hlmFieldLabel for="legajo">Legajo</label>
          <input hlmInput type="text" id="legajo" placeholder="1042" />
        </hlm-field>
        <hlm-field>
          <label hlmFieldLabel for="password">Contraseña</label>
          <input hlmInput type="password" id="password" />
        </hlm-field>
        <hlm-field>
          <button hlmBtn type="submit">Iniciar sesión</button>
        </hlm-field>
      </hlm-field-group>
    </form>
  </div>
</hlm-card>
