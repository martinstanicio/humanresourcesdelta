<div
  class="grid w-full grid-cols-3 items-center justify-center rounded-lg bg-muted p-1 text-muted-foreground"
>
  <button
    class="flex h-7 w-full items-center justify-center rounded-md transition-all"
    hlmTooltip="Tema claro"
    position="top"
    type="button"
    [class.bg-background]="mode() === 'light'"
    [class.hover:text-foreground]="mode() !== 'light'"
    [class.shadow-xs]="mode() === 'light'"
    [class.text-foreground]="mode() === 'light'"
    [class.text-muted-foreground]="mode() !== 'light'"
    (click)="setMode('light')"
  >
    <ng-icon class="text-sm" name="lucideSun" />
    <span class="sr-only">Tema claro</span>
  </button>
  <button
    class="flex h-7 w-full items-center justify-center rounded-md transition-all"
    hlmTooltip="Tema oscuro"
    position="top"
    type="button"
    [class.bg-background]="mode() === 'dark'"
    [class.hover:text-foreground]="mode() !== 'dark'"
    [class.shadow-xs]="mode() === 'dark'"
    [class.text-foreground]="mode() === 'dark'"
    [class.text-muted-foreground]="mode() !== 'dark'"
    (click)="setMode('dark')"
  >
    <ng-icon class="text-sm" name="lucideMoon" />
    <span class="sr-only">Tema oscuro</span>
  </button>
  <button
    class="flex h-7 w-full items-center justify-center rounded-md transition-all"
    hlmTooltip="Tema del sistema"
    position="top"
    type="button"
    [class.bg-background]="mode() === 'system'"
    [class.hover:text-foreground]="mode() !== 'system'"
    [class.shadow-xs]="mode() === 'system'"
    [class.text-foreground]="mode() === 'system'"
    [class.text-muted-foreground]="mode() !== 'system'"
    (click)="setMode('system')"
  >
    <ng-icon class="text-sm" name="lucideMonitor" />
    <span class="sr-only">Tema del sistema</span>
  </button>
</div>
