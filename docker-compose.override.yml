services:
  api:
    command:
      - sh
      - -c
      - |
        uv run manage.py migrate
        exec uv run manage.py runserver 0.0.0.0:8000
    environment:
      ENVIRONMENT: dev
    volumes:
      - ./api:/api

  client:
    command: npm run start -- --host 0.0.0.0 --configuration development
    environment:
      ENVIRONMENT: dev
    volumes:
      - ./client:/client
      - /client/node_modules
