services:
  api:
    build:
      context: ./api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: "db"
    container_name: humanresourcesdelta-api
    image: humanresourcesdelta-api
    restart: unless-stopped

  client:
    build:
      context: ./client
    container_name: humanresourcesdelta-client
    image: humanresourcesdelta-client
    restart: unless-stopped

  db:
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 10s
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      timeout: 5s
    image: postgres:18
    restart: unless-stopped
    volumes:
      - data:/var/lib/postgresql

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  data:
