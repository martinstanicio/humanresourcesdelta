services:
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./api
    environment:
      DB_HOST: "db"
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./api:/api
    depends_on:
      db:
        condition: service_healthy

volumes:
  data:
